version: '3.8'

services:
  backend:
    build:
      context: ./treasure
      dockerfile: Dockerfile
    container_name: treasure_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:3001
      - JWT_SECRET=your_super_secret_key # In production, change this or pass it from external .env
      - SESSION_SECRET=default-secret-key
    volumes:
      - backend_uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./treasure_hunt_react
      dockerfile: Dockerfile
      args:
        # The browser needs to know how to reach the backend mapped port on the host machine
        - REACT_APP_API_URL=http://localhost:3000
    container_name: treasure_frontend
    ports:
      # Expose Nginx on port 3001 to avoid conflict, accessing frontend via http://localhost:3001
      - "3001:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
